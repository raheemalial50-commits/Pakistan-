<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <i class="fas fa-graduation-cap"></i>
      <h4>THE SMART MODERN PUBLIC SCHOOL</h4>
      <p>Qamber · School Management System</p>
    </div>

    <div class="alert alert-warning py-2 small" role="alert">
      <i class="fas fa-info-circle me-1"></i> <strong>DEMO MODE</strong> — LocalStorage only. Do not use real credentials.
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username / Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" class="form-control" id="username" name="username" required autocomplete="username" placeholder="Enter username or email">
        </div>
        <div class="invalid-feedback">Please enter username or email.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
          <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback">Please enter password.</div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>
        <a href="#" class="small text-decoration-none" onclick="alert('Demo: Contact admin to reset password.'); return false;">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </button>
    </form>

    <div class="demo-accounts">
      <h6><i class="fas fa-key me-1"></i> Demo Accounts (click to fill)</h6>
      <div id="demoAccountsList"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      seedDemoData();
      if (Auth.isLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Demo accounts UI
      const list = document.getElementById('demoAccountsList');
      Auth.getDemoAccounts().forEach(acc => {
        const div = document.createElement('div');
        div.className = 'demo-account-item cursor-pointer';
        div.innerHTML = `<span><strong>${acc.role}</strong>: ${acc.username}</span><span class="text-muted">${acc.password}</span>`;
        div.onclick = () => {
          document.getElementById('username').value = acc.username;
          document.getElementById('password').value = acc.password;
        };
        list.appendChild(div);
      });

      // Toggle password
      document.getElementById('togglePassword').addEventListener('click', function() {
        const input = document.getElementById('password');
        const icon = this.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });

      // Login form
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target;
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('rememberMe').checked;
        const result = Auth.login(username, password, remember);
        if (result.success) {
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 500);
        } else {
          showToast(result.message, 'error');
        }
      });
    });
  </script>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/923362506588?text=Assalamualaikum!%20THE%20SMART%20MODERN%20PUBLIC%20SCHOOL%20QAMBER%20se%20rabta%20karna%20hai." 
     class="whatsapp-float" target="_blank" rel="noopener noreferrer" title="Chat on WhatsApp" aria-label="Chat on WhatsApp">
    <i class="fab fa-whatsapp"></i>
  </a>

</body>
</html>

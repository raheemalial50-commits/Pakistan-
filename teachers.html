<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers - SMPS Qamber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="content-area">
        <div class="card">
          <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span><i class="fas fa-chalkboard-teacher me-2"></i>All Teachers</span>
            <div class="d-flex gap-2">
              <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search..." style="width:180px">
              <button class="btn btn-sm btn-primary" id="btnAdd" onclick="openTeacherModal()"><i class="fas fa-plus me-1"></i>Add Teacher</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead><tr><th>ID</th><th>Name</th><th>Designation</th><th>Subjects</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
            <div id="emptyState" class="empty-state d-none"><i class="fas fa-chalkboard-teacher"></i><h5>No teachers found</h5><button class="btn btn-primary" onclick="openTeacherModal()">Add Teacher</button></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="modal fade" id="teacherModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Teacher</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="teacherForm">
          <div class="modal-body">
            <input type="hidden" id="teacherId">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Full Name *</label><input type="text" class="form-control" id="tName" required></div>
              <div class="col-md-6"><label class="form-label">Employee ID</label><input type="text" class="form-control" id="tEmpId"></div>
              <div class="col-md-4"><label class="form-label">Gender *</label><select class="form-select" id="tGender" required><option value="">Select</option><option>Male</option><option>Female</option></select></div>
              <div class="col-md-4"><label class="form-label">Phone *</label><input type="tel" class="form-control" id="tPhone" required></div>
              <div class="col-md-4"><label class="form-label">Email</label><input type="email" class="form-control" id="tEmail"></div>
              <div class="col-md-6"><label class="form-label">Qualification</label><input type="text" class="form-control" id="tQual"></div>
              <div class="col-md-6"><label class="form-label">Designation</label><input type="text" class="form-control" id="tDesig" value="Teacher"></div>
              <div class="col-md-6"><label class="form-label">Joining Date</label><input type="date" class="form-control" id="tJoin"></div>
              <div class="col-md-6"><label class="form-label">Salary</label><input type="number" class="form-control" id="tSalary"></div>
              <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" id="tAddress" rows="2"></textarea></div>
              <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" id="tStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requirePermission('teachers', 'view')) return;
      seedDemoData();
      initLayout('teachers', 'Teachers');
      document.getElementById('searchInput').addEventListener('input', render);
      document.getElementById('teacherForm').addEventListener('submit', save);
      if (!Auth.hasPermission('teachers', 'add')) document.getElementById('btnAdd')?.classList.add('d-none');
      render();
    });
    function render() {
      let data = SMS.getData('teachers');
      const q = document.getElementById('searchInput').value.toLowerCase();
      if (q) data = data.filter(t => t.name.toLowerCase().includes(q) || (t.employeeId||'').toLowerCase().includes(q));
      const tbody = document.getElementById('tableBody');
      const empty = document.getElementById('emptyState');
      if (!data.length) { tbody.innerHTML = ''; empty.classList.remove('d-none'); return; }
      empty.classList.add('d-none');
      tbody.innerHTML = data.map(t => `
        <tr>
          <td>${t.employeeId || t.id}</td>
          <td class="fw-semibold">${t.name}</td>
          <td>${t.designation || '-'}</td>
          <td>${(t.assignedSubjects || []).join(', ') || '-'}</td>
          <td>${t.phone || '-'}</td>
          <td>${getStatusBadge(t.status)}</td>
          <td>
            <div class="btn-group btn-group-sm">
              ${Auth.hasPermission('teachers','edit') ? `<button class="btn btn-outline-secondary" onclick="editT('${t.id}')"><i class="fas fa-edit"></i></button>` : ''}
              ${Auth.hasPermission('teachers','delete') ? `<button class="btn btn-outline-danger" onclick="delT('${t.id}')"><i class="fas fa-trash"></i></button>` : ''}
            </div>
          </td>
        </tr>`).join('');
    }
    function openTeacherModal(id) {
      document.getElementById('teacherForm').reset();
      document.getElementById('teacherId').value = '';
      document.getElementById('modalTitle').textContent = id ? 'Edit Teacher' : 'Add Teacher';
      if (id) {
        const t = SMS.getById('teachers', id);
        if (!t) return;
        document.getElementById('teacherId').value = t.id;
        document.getElementById('tName').value = t.name || '';
        document.getElementById('tEmpId').value = t.employeeId || '';
        document.getElementById('tGender').value = t.gender || '';
        document.getElementById('tPhone').value = t.phone || '';
        document.getElementById('tEmail').value = t.email || '';
        document.getElementById('tQual').value = t.qualification || '';
        document.getElementById('tDesig').value = t.designation || '';
        document.getElementById('tJoin').value = t.joiningDate || '';
        document.getElementById('tSalary').value = t.salary || '';
        document.getElementById('tAddress').value = t.address || '';
        document.getElementById('tStatus').value = t.status || 'active';
      }
      new bootstrap.Modal(document.getElementById('teacherModal')).show();
    }
    function editT(id) { openTeacherModal(id); }
    function save(e) {
      e.preventDefault();
      const id = document.getElementById('teacherId').value;
      const data = {
        name: document.getElementById('tName').value.trim(),
        employeeId: document.getElementById('tEmpId').value.trim(),
        gender: document.getElementById('tGender').value,
        phone: document.getElementById('tPhone').value.trim(),
        email: document.getElementById('tEmail').value.trim(),
        qualification: document.getElementById('tQual').value.trim(),
        designation: document.getElementById('tDesig').value.trim(),
        joiningDate: document.getElementById('tJoin').value,
        salary: Number(document.getElementById('tSalary').value) || 0,
        address: document.getElementById('tAddress').value.trim(),
        status: document.getElementById('tStatus').value,
        assignedSubjects: [], assignedClasses: []
      };
      if (id) { SMS.updateData('teachers', id, data); showToast('Teacher updated'); }
      else { SMS.addData('teachers', data); showToast('Teacher added'); }
      bootstrap.Modal.getInstance(document.getElementById('teacherModal')).hide();
      render();
    }
    function delT(id) {
      confirmModal('Delete Teacher', 'Are you sure?', () => { SMS.deleteData('teachers', id); showToast('Deleted'); render(); });
    }
    window.openTeacherModal = openTeacherModal;
    window.editT = editT;
    window.delT = delT;
  </script>
</body>
</html>

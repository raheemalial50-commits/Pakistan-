<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - SMPS Qamber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="content-area">
        <div class="card mb-3">
          <div class="card-header">Mark Student Attendance</div>
          <div class="card-body">
            <div class="row g-3 align-items-end">
              <div class="col-md-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" id="attDate">
              </div>
              <div class="col-md-3">
                <label class="form-label">Class</label>
                <select class="form-select" id="attClass"></select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Section</label>
                <select class="form-select" id="attSection"></select>
              </div>
              <div class="col-md-3">
                <button class="btn btn-primary w-100" onclick="loadStudents()"><i class="fas fa-search me-1"></i>Load Students</button>
              </div>
            </div>
          </div>
        </div>
        <div class="card" id="attendanceCard" style="display:none">
          <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span id="attTitle">Attendance</span>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-success" onclick="markAll('Present')">Mark All Present</button>
              <button class="btn btn-danger" onclick="markAll('Absent')">Mark All Absent</button>
              <button class="btn btn-primary" onclick="saveAttendance()"><i class="fas fa-save me-1"></i>Save</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead><tr><th>Roll</th><th>Name</th><th>Status</th></tr></thead>
                <tbody id="attTable"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="row g-3 mt-2">
          <div class="col-md-4"><div class="stat-card"><div class="stat-value text-success" id="sumPresent">0</div><div class="stat-label">Present</div></div></div>
          <div class="col-md-4"><div class="stat-card"><div class="stat-value text-danger" id="sumAbsent">0</div><div class="stat-label">Absent</div></div></div>
          <div class="col-md-4"><div class="stat-card"><div class="stat-value text-warning" id="sumLeave">0</div><div class="stat-label">Leave</div></div></div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentStudents = [];
    let attendanceMap = {};

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requirePermission('attendance', 'view')) return;
      seedDemoData();
      initLayout('attendance', 'Attendance');
      document.getElementById('attDate').value = new Date().toISOString().split('T')[0];
      const classes = SMS.getData('classes');
      document.getElementById('attClass').innerHTML = '<option value="">Select Class</option>' + classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('attClass').addEventListener('change', () => {
        const cid = document.getElementById('attClass').value;
        document.getElementById('attSection').innerHTML = '<option value="">Select Section</option>' +
          SMS.getData('sections').filter(s => s.classId === cid).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      });
    });

    function loadStudents() {
      const date = document.getElementById('attDate').value;
      const classId = document.getElementById('attClass').value;
      const sectionId = document.getElementById('attSection').value;
      if (!date || !classId || !sectionId) { showToast('Please select date, class and section', 'warning'); return; }
      currentStudents = SMS.getData('students').filter(s => s.classId === classId && s.sectionId === sectionId && s.status === 'active');
      const existing = SMS.getData('attendance').filter(a => a.date === date && a.sectionId === sectionId);
      attendanceMap = {};
      existing.forEach(a => { attendanceMap[a.studentId] = a.status; });
      currentStudents.forEach(s => { if (!attendanceMap[s.id]) attendanceMap[s.id] = 'Present'; });

      document.getElementById('attTitle').textContent = `Attendance · ${date} · ${currentStudents[0]?.className || ''} - ${currentStudents[0]?.sectionName || ''}`;
      document.getElementById('attendanceCard').style.display = 'block';
      renderAttTable();
    }

    function renderAttTable() {
      document.getElementById('attTable').innerHTML = currentStudents.map(s => {
        const st = attendanceMap[s.id] || 'Present';
        return `<tr>
          <td>${s.rollNo || '-'}</td>
          <td>${s.name}</td>
          <td>
            <div class="btn-group btn-group-sm">
              <button type="button" class="btn att-btn ${st==='Present'?'active-present':'btn-outline-success'}" onclick="setStatus('${s.id}','Present')">Present</button>
              <button type="button" class="btn att-btn ${st==='Absent'?'active-absent':'btn-outline-danger'}" onclick="setStatus('${s.id}','Absent')">Absent</button>
              <button type="button" class="btn att-btn ${st==='Leave'?'active-leave':'btn-outline-warning'}" onclick="setStatus('${s.id}','Leave')">Leave</button>
            </div>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="3" class="text-center text-muted">No students in this section</td></tr>';
      updateSummary();
    }

    function setStatus(id, status) {
      attendanceMap[id] = status;
      renderAttTable();
    }

    function markAll(status) {
      currentStudents.forEach(s => attendanceMap[s.id] = status);
      renderAttTable();
    }

    function updateSummary() {
      let p=0,a=0,l=0;
      Object.values(attendanceMap).forEach(s => { if(s==='Present')p++; else if(s==='Absent')a++; else if(s==='Leave')l++; });
      document.getElementById('sumPresent').textContent = p;
      document.getElementById('sumAbsent').textContent = a;
      document.getElementById('sumLeave').textContent = l;
    }

    function saveAttendance() {
      if (!Auth.hasPermission('attendance', 'edit') && !Auth.hasPermission('attendance', 'manage')) {
        showToast('Permission denied', 'error'); return;
      }
      const date = document.getElementById('attDate').value;
      const sectionId = document.getElementById('attSection').value;
      let all = SMS.getData('attendance').filter(a => !(a.date === date && a.sectionId === sectionId));
      currentStudents.forEach(s => {
        all.push({
          id: `att_${s.id}_${date}`,
          studentId: s.id,
          studentName: s.name,
          classId: s.classId,
          className: s.className,
          sectionId: s.sectionId,
          sectionName: s.sectionName,
          date,
          status: attendanceMap[s.id] || 'Present',
          markedBy: Auth.getCurrentUser()?.id
        });
      });
      SMS.saveData('attendance', all);
      showToast('Attendance saved successfully');
    }

    window.loadStudents = loadStudents;
    window.setStatus = setStatus;
    window.markAll = markAll;
    window.saveAttendance = saveAttendance;
  </script>
</body>
</html>

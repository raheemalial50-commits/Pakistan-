<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - SMPS Qamber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="content-area">
        <div class="card">
          <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span><i class="fas fa-user-graduate me-2"></i>All Students</span>
            <div class="d-flex flex-wrap gap-2">
              <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search..." style="width:180px">
              <select class="form-select form-select-sm" id="filterClass" style="width:140px"><option value="">All Classes</option></select>
              <select class="form-select form-select-sm" id="filterStatus" style="width:120px">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
              <button class="btn btn-sm btn-outline-secondary" onclick="exportStudents()"><i class="fas fa-download me-1"></i>Export</button>
              <button class="btn btn-sm btn-primary" id="btnAddStudent" onclick="openStudentModal()"><i class="fas fa-plus me-1"></i>Add Student</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>Adm No</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Section</th>
                    <th>Roll</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th class="no-print">Actions</th>
                  </tr>
                </thead>
                <tbody id="studentsTable"></tbody>
              </table>
            </div>
            <div id="emptyState" class="empty-state d-none">
              <i class="fas fa-user-graduate"></i>
              <h5>No students found</h5>
              <p>Add your first student to get started.</p>
              <button class="btn btn-primary" onclick="openStudentModal()"><i class="fas fa-plus me-1"></i>Add Student</button>
            </div>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted" id="tableInfo">Showing 0 students</small>
            <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Student Modal -->
  <div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="studentModalTitle">Add Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="studentForm">
          <div class="modal-body">
            <input type="hidden" id="studentId">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="stuName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Admission Number *</label>
                <input type="text" class="form-control" id="stuAdmNo" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Father's Name *</label>
                <input type="text" class="form-control" id="stuFather" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Mother's Name</label>
                <input type="text" class="form-control" id="stuMother">
              </div>
              <div class="col-md-4">
                <label class="form-label">Date of Birth *</label>
                <input type="date" class="form-control" id="stuDob" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Gender *</label>
                <select class="form-select" id="stuGender" required>
                  <option value="">Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Blood Group</label>
                <select class="form-select" id="stuBlood">
                  <option value="">Select</option>
                  <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                  <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Class *</label>
                <select class="form-select" id="stuClass" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Section *</label>
                <select class="form-select" id="stuSection" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Roll Number</label>
                <input type="number" class="form-control" id="stuRoll">
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone *</label>
                <input type="tel" class="form-control" id="stuPhone" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="stuEmail">
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <textarea class="form-control" id="stuAddress" rows="2"></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">City</label>
                <input type="text" class="form-control" id="stuCity" value="Qamber">
              </div>
              <div class="col-md-6">
                <label class="form-label">Admission Date</label>
                <input type="date" class="form-control" id="stuAdmDate">
              </div>
              <div class="col-md-6">
                <label class="form-label">Previous School</label>
                <input type="text" class="form-control" id="stuPrevSchool">
              </div>
              <div class="col-md-6">
                <label class="form-label">Emergency Contact</label>
                <input type="tel" class="form-control" id="stuEmergency">
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-select" id="stuStatus">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Student</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/students.js"></script>
</body>
</html>
